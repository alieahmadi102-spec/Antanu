<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title }} | آنتانو</title>
  <link rel="icon" href="/static/logo.png">
  <meta name="theme-color" content="#0d1017">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script>try{var t=localStorage.getItem("antanu_theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body class="chat-page shared-page">
  <main style="margin:0 auto;max-width:820px">
    <header>
      <img src="/static/logo.png" class="logo-sm" alt="ANTANU" width="34" height="34" style="width:34px;height:34px;border-radius:50%">
      <h1>آنتانو <span>ANTANU</span></h1>
      <span class="limit-note">گفتگوی به‌اشتراک‌گذاشته‌شده</span>
    </header>

    <div id="messages"></div>

    <div class="shared-foot">
      این گفتگو با <b>آنتانو</b> ساخته شده است.
      <a href="/login">ساخت گفتگوی خودتان →</a>
    </div>
  </main>

  <script>
    const MESSAGES = {{ messages|safe }};
    const msgsEl = document.getElementById("messages");

    function renderMD(text) {
      const cleaned = (text || "")
        .replace(/\[\[ANTANU_IMG:([^\]\s]+)\]\]/g, (m, u) => u.startsWith("/download/") ? `\n\n![](${u})\n\n` : "")
        .replace(/\[\[ANTANU_VID:([^\]\s]+)\]\]/g, "");
      return DOMPurify.sanitize(marked.parse(cleaned));
    }

    MESSAGES.forEach(m => {
      const isUser = m.role === "user";
      const div = document.createElement("div");
      div.className = "msg " + m.role;
      div.innerHTML = `
        <div class="avatar">${isUser ? "👤" : '<img src="/static/logo.png" alt="" style="width:100%;height:100%;border-radius:9px;object-fit:cover">'}</div>
        <div class="bubble"><div class="md"></div></div>`;
      const md = div.querySelector(".md");
      if (isUser) md.textContent = m.content;
      else md.innerHTML = renderMD(m.content);
      msgsEl.appendChild(div);
    });
  </script>
</body>
</html>
