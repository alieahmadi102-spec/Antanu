<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/static/logo.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0d1017">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t("register.page_title") }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script>try{var t=localStorage.getItem("antanu_theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_ver }}">
</head>
<body class="auth-body">
  <div class="auth-card">
    <img src="/static/logo.png" class="logo-auth" alt="ANTANU" width="90" height="90" style="display:block;width:90px;height:90px;border-radius:50%;margin:0 auto 10px">
    <div class="logo">{{ t("app.name") }}<small>ANTANU</small></div>
    <h2>{{ t("register.heading") }}</h2>

    {% include "_langpicker.html" %}

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="post" action="/register">
      <div class="field">
        <label>{{ t("register.username") }}</label>
        <input type="text" name="username" class="ltr" required minlength="3">
      </div>
      <div class="field">
        <label>{{ t("guest.password") }}</label>
        <div class="pw-wrap">
          <input type="password" name="password" class="ltr" required minlength="6" autocomplete="new-password">
          <button type="button" class="pw-toggle" tabindex="-1" title="{{ t('login.show_password') }}">👁</button>
        </div>
      </div>
      <div class="field">
        <label>{{ t("register.code") }}</label>
        <input type="text" name="code" class="ltr" required minlength="50" maxlength="50"
               placeholder="{{ t('register.code') }}">
      </div>
      <input type="hidden" name="fingerprint" value="">
      <button type="submit" class="btn-primary">{{ t("register.submit") }}</button>
    </form>

    <div class="auth-links">
      {{ t("register.have_account") }} <a href="/login">{{ t("login.submit") }}</a>
      &nbsp;•&nbsp;
      <a href="/buy">{{ t("login.buy") }}</a>
    </div>
    <p class="ver-line" style="text-align:center;margin-top:14px">{{ t("common.version", version=version) }}</p>
  </div>
  <script src="/static/fingerprint.js"></script>
</body>
</html>
