<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ t("help.page_title") }}</title>
  <link rel="icon" href="/static/logo.png">
  <meta name="theme-color" content="#0d1017">
  <link rel="stylesheet" href="/static/vendor/vazirmatn/vazirmatn.css?v={{ asset_ver }}">
  <script>try{var t=localStorage.getItem("antanu_theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="/static/style.css?v={{ asset_ver }}">
</head>
<body class="chat-page help-page">
  <main style="margin:0 auto;max-width:820px">
    <header>
      <a href="/chat" style="text-decoration:none"><button id="menuBtn">→</button></a>
      <img src="/static/logo.png" class="logo-sm" alt="ANTANU" width="34" height="34" style="width:34px;height:34px;border-radius:50%">
      <h1>آنتانو <span>ANTANU</span></h1>
      <span class="limit-note">{{ t("help.title") }}</span>
    </header>

    <div id="messages" style="padding:24px 18px">
      <div style="margin-bottom:16px">{% include "_langpicker.html" %}</div>
      {% if translating %}
      <p class="help-note">{{ translating }}</p>
      {% endif %}
      <div class="md help-content">{{ content_html|safe }}</div>
      <div class="shared-foot">
        <a href="/chat">{{ t("help.back") }}</a>
      </div>
    </div>
  </main>
</body>
</html>
